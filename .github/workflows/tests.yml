name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install the locked dependencies (Python version from .python-version)
        run: uv sync --locked --all-extras
      - name: Run the tests (offline: no model, weights or dataset is downloaded)
        run: uv run pytest
