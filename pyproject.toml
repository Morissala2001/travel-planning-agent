[project]
name = "travel-agent"
version = "0.1.0"
description = "A travel-planning agent: SQL and semantic-search tools, a budget loop that explains its trade-offs, guarded booking, answers in English, French or Russian."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morissala2001" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pypdf>=6.14",
    "sentence-transformers>=5.6",
    "torch>=2.11",
]

[project.optional-dependencies]
app = ["streamlit>=1.65"]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real sentence encoder (set TRAVEL_AGENT_RUN_SLOW=1 to run)"]
